[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

; Библиотеки
lib_deps =
    SPI
    nRF24/RF24@^1.4.7
    bblanchon/ArduinoJson@^6.21.3 ; Для работы с JSON (если нужно отправлять данные в облако)

; Настройки Wi-Fi
build_flags =
    -D WIFI_SSID=\"ВАШ_WIFI\"
    -D WIFI_PASSWORD=\"ВАШ_ПАРОЛЬ\"