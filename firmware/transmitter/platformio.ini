[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

; Библиотеки
lib_deps =
    SPI
    nRF24/RF24@^1.4.7
    adafruit/DHT sensor library@^1.4.6

; Настройки компилятора
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK22x
    -D CORE_DEBUG_LEVEL=0